# =============================================================================
# CTMS - Azure DevOps pipeline
#
# Triggers
#   CI  : every push to `main`
#   PR  : validation build for pull requests targeting `main`
#         (.github/workflows/ci.yml is the required PR *check*; this pipeline
#          runs the same restore/build/test on PRs and additionally packages +
#          deploys on `main`.)
#
# Stages
#   Build            - install SDK, restore, build (warnings-as-errors).
#   UnitTests        - CTMS.Application.Tests + CTMS.Client.Tests, + coverage.
#   IntegrationTests - CTMS.Api.IntegrationTests (HTTP surface), + coverage.
#   Coverage         - merge every tier's Cobertura into one report.
#   Security         - `dotnet list package --vulnerable` over the shipping
#                      projects; fails on a vulnerable transitive.
#   Package          - `dotnet publish` the API + `docker buildAndPush` to ACR.
#                      `main` only.
#   Deploy_*         - one stage per environment (Development / Test / Staging /
#                      Production) that runs deploy/azure/main.bicep. Every stage
#                      is INERT by default (`deployEnabled` = false) and gated on
#                      an Azure DevOps Environment; Production also carries an
#                      in-pipeline ManualValidation approval. See
#                      docs/azure-devops.md.
#
# MongoDB for the tests
#   No service / resource container. Both suites self-provision and neither reads
#   ConnectionStrings:CtmsDatabase:
#     * CTMS.Application.Tests   - EphemeralMongo (in-process mongod).
#     * CTMS.Client.Tests       - stub HttpMessageHandler.
#     * CTMS.Api.IntegrationTests - Testcontainers `mongo:7` when the agent has a
#       Docker daemon (vmImage: ubuntu-latest does), else EphemeralMongo.
#
# Variable groups (Pipelines > Library) - referenced, never defined here:
#   ctms-ci     - shared CI knobs.
#   ctms-acr    - registry coordinates:
#                   acrServiceConnection  - Docker registry service connection name
#                   acrLoginServer        - e.g. myregistry.azurecr.io
#                   imageRepository       - e.g. ctms/api
#   ctms-deploy - deployment coordinates (only needed once Deploy_* is enabled):
#                   azureServiceConnection - ARM / workload-identity connection name
#                   resourceGroupDev / resourceGroupTest / resourceGroupStaging /
#                   resourceGroupProd
#
# No secrets or real connection strings live in this file. Mongo/Redis
# connection strings are Key Vault references resolved by the container app's
# managed identity (see docs/azure-deployment.md).
# =============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - group: ctms-ci
  - group: ctms-acr
  - group: ctms-deploy
  - name: buildConfiguration
    value: Release
  - name: vmImage
    value: ubuntu-latest
  - name: isMain
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  # Flip a Deploy_* stage on by setting the matching variable to 'true' here or
  # in the ctms-deploy variable group, once deploy/azure + the ADO Environment
  # exist. Left 'false' so the deploy stages never run from this commit.
  - name: deployDevelopment
    value: 'false'
  - name: deployTest
    value: 'false'
  - name: deployStaging
    value: 'false'
  - name: deployProduction
    value: 'false'

stages:
  # ---------------------------------------------------------------------------
  - stage: Build
    displayName: Restore & build
    jobs:
      - job: build
        displayName: Restore, build (warnings-as-errors)
        pool:
          vmImage: $(vmImage)
        steps:
          - template: .azuredevops/templates/build-steps.yml
            parameters:
              buildConfiguration: $(buildConfiguration)

  # ---------------------------------------------------------------------------
  - stage: UnitTests
    displayName: Unit tests
    dependsOn: Build
    jobs:
      - job: unit
        displayName: Application + client suites (+coverage)
        pool:
          vmImage: $(vmImage)
        steps:
          - template: .azuredevops/templates/test-steps.yml
            parameters:
              buildConfiguration: $(buildConfiguration)
              displayName: Unit tests (application + client)
              runName: unit
              testProjects: |
                tests/CTMS.Application.Tests/CTMS.Application.Tests.csproj
                tests/CTMS.Client.Tests/CTMS.Client.Tests.csproj

  # ---------------------------------------------------------------------------
  - stage: IntegrationTests
    displayName: Integration tests
    dependsOn: Build
    jobs:
      - job: integration
        displayName: HTTP surface via WebApplicationFactory (+coverage)
        pool:
          vmImage: $(vmImage)   # has a Docker daemon -> Testcontainers mongo:7
        steps:
          - template: .azuredevops/templates/test-steps.yml
            parameters:
              buildConfiguration: $(buildConfiguration)
              displayName: Integration tests (HTTP surface)
              runName: integration
              testProjects: tests/CTMS.Api.IntegrationTests/CTMS.Api.IntegrationTests.csproj

  # ---------------------------------------------------------------------------
  - stage: Coverage
    displayName: Code coverage
    dependsOn:
      - UnitTests
      - IntegrationTests
    jobs:
      - job: coverage
        displayName: Merge Cobertura (ReportGenerator)
        pool:
          vmImage: $(vmImage)
        steps:
          - template: .azuredevops/templates/coverage-steps.yml

  # ---------------------------------------------------------------------------
  - stage: Security
    displayName: Security / dependency scan
    dependsOn: Build
    jobs:
      - job: scan
        displayName: NuGet advisory scan (shipping projects)
        pool:
          vmImage: $(vmImage)
        steps:
          - template: .azuredevops/templates/security-steps.yml
            parameters:
              buildConfiguration: $(buildConfiguration)

  # ---------------------------------------------------------------------------
  - stage: Package
    displayName: Docker build & publish artifacts
    dependsOn:
      - UnitTests
      - IntegrationTests
      - Coverage
      - Security
    condition: and(succeeded(), eq(variables.isMain, 'true'))
    jobs:
      - job: package
        displayName: dotnet publish + docker buildAndPush
        pool:
          vmImage: $(vmImage)
        steps:
          - template: .azuredevops/templates/package-steps.yml
            parameters:
              buildConfiguration: $(buildConfiguration)
              acrServiceConnection: $(acrServiceConnection)
              imageRepository: $(imageRepository)

  # ---------------------------------------------------------------------------
  # Deploy - one stage per environment. All inert until `deploy*` is 'true'.
  # Production carries an in-pipeline ManualValidation approval on top of its
  # Azure DevOps Environment checks.
  - template: .azuredevops/templates/deploy-stage.yml
    parameters:
      stageName: Deploy_Development
      displayName: Deploy - Development
      dependsOn: Package
      environmentName: ctms-development
      deployEnabled: $(deployDevelopment)
      bicepEnvironmentName: dev
      azureServiceConnection: $(azureServiceConnection)
      resourceGroup: $(resourceGroupDev)
      acrLoginServer: $(acrLoginServer)
      imageRepository: $(imageRepository)

  - template: .azuredevops/templates/deploy-stage.yml
    parameters:
      stageName: Deploy_Test
      displayName: Deploy - Test
      dependsOn: Deploy_Development
      environmentName: ctms-test
      deployEnabled: $(deployTest)
      bicepEnvironmentName: test
      azureServiceConnection: $(azureServiceConnection)
      resourceGroup: $(resourceGroupTest)
      acrLoginServer: $(acrLoginServer)
      imageRepository: $(imageRepository)

  - template: .azuredevops/templates/deploy-stage.yml
    parameters:
      stageName: Deploy_Staging
      displayName: Deploy - Staging
      dependsOn: Deploy_Test
      environmentName: ctms-staging
      deployEnabled: $(deployStaging)
      # main.bicep's environmentName only allows dev|test|prod; Staging maps onto
      # `test` naming until the infra workstream adds a `staging` value.
      bicepEnvironmentName: test
      azureServiceConnection: $(azureServiceConnection)
      resourceGroup: $(resourceGroupStaging)
      acrLoginServer: $(acrLoginServer)
      imageRepository: $(imageRepository)

  - template: .azuredevops/templates/deploy-stage.yml
    parameters:
      stageName: Deploy_Production
      displayName: Deploy - Production
      dependsOn: Deploy_Staging
      environmentName: ctms-production
      deployEnabled: $(deployProduction)
      requireManualApproval: true
      bicepEnvironmentName: prod
      azureServiceConnection: $(azureServiceConnection)
      resourceGroup: $(resourceGroupProd)
      acrLoginServer: $(acrLoginServer)
      imageRepository: $(imageRepository)
