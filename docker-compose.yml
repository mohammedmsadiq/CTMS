# ---------------------------------------------------------------------------
# LOCAL DEVELOPMENT stack: API + MongoDB + Redis.
#
#   docker compose up --build
#
# This file is the dev posture and nothing else:
#   ASPNETCORE_ENVIRONMENT=Development, Seed__Enabled=true, Auth__Enabled=false,
#   RateLimit__Enabled=false — every request is a synthetic all-roles principal
#   and the API is safe to hammer by hand.
#
# For the production posture (auth on, seed off, rate limiting on, hardened
# container, internal-only datastores) layer the prod override on top:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# API:     http://localhost:8080  (Swagger at /swagger)
# Mongo:   localhost:27017
# Redis:   localhost:6379
#
# Override any value via a local .env file (see .env.example).
# ---------------------------------------------------------------------------

services:
  mongo:
    # Dev keeps the floating :7 tag; docker-compose.prod.yml pins a digest.
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    # Dev keeps the floating :7-alpine tag; docker-compose.prod.yml pins a digest.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # --- datastore (MongoDB) ---------------------------------------------
      ConnectionStrings__CtmsDatabase: "${CTMS_DATABASE__CONNECTION_STRING:-mongodb://mongo:27017}"
      Mongo__Database: "${MONGO_DATABASE:-ctms}"
      # --- cache (Redis) -------------------------------------------------------
      # Also the DataProtection key ring: keys now persist to this Redis instance
      # (keyed off ConnectionStrings:Redis), so they survive an api container
      # restart instead of being regenerated on every boot.
      ConnectionStrings__Redis: "${CTMS_REDIS__CONNECTION_STRING:-redis:6379}"
      # --- host --------------------------------------------------------------
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
      Seed__Enabled: "${SEED_ENABLED:-true}"
      # --- auth ------------------------------------------------------------
      # Local stack runs with auth off: every request is a synthetic all-roles
      # principal, so no Entra ID registration is needed. Set Auth__Enabled=true
      # (and the AzureAd__* vars) to exercise real JWT bearer auth. Refused when
      # ASPNETCORE_ENVIRONMENT=Production.
      Auth__Enabled: "${AUTH_ENABLED:-false}"
      Auth__PublicBundleReads: "${AUTH_PUBLIC_BUNDLE_READS:-true}"
      # --- request hardening -----------------------------------------------
      # Off locally so hammering the API by hand doesn't 429. Flip via .env, or
      # use docker-compose.prod.yml which turns it on. CORS allow-list and the
      # request-body cap (Cors__AllowedOrigins__0 / Limits__MaxRequestBodyBytes)
      # are likewise left at app defaults here and set in the prod override.
      RateLimit__Enabled: "${RATELIMIT_ENABLED:-false}"

volumes:
  mongo-data:
