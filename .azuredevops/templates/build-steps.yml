# -----------------------------------------------------------------------------
# Reusable RESTORE + BUILD steps for CTMS.
#
# Installs the exact .NET SDK pinned in global.json, restores the solution and
# builds it in the requested configuration. The build is warnings-as-errors
# (Directory.Build.props: <TreatWarningsAsErrors>true</TreatWarningsAsErrors>),
# so any analyzer or compiler warning fails this template.
#
# Consumed by azure-pipelines.yml (the Build stage) and by test-steps.yml, which
# needs the build outputs present in its own job before `dotnet test --no-build`.
# Keep it free of secrets and pool config.
# -----------------------------------------------------------------------------
parameters:
  - name: buildConfiguration
    type: string
    default: Release
  - name: solution
    type: string
    default: CTMS.sln
  - name: restoreOnly
    type: boolean
    default: false

steps:
  - task: UseDotNet@2
    displayName: Install .NET SDK (pinned by global.json)
    inputs:
      packageType: sdk
      useGlobalJson: true

  - script: dotnet --info
    displayName: Report .NET SDK version

  # No lock files in the repo, so key the NuGet cache on the project files + the
  # shared build props + the SDK pin. ~/.cache/ephemeral-mongo holds the mongod
  # binary EphemeralMongo downloads once for the test suites.
  - task: Cache@2
    displayName: Cache NuGet + EphemeralMongo
    inputs:
      key: '"ctms" | "$(Agent.OS)" | **/*.csproj, Directory.Build.props, global.json'
      restoreKeys: |
        "ctms" | "$(Agent.OS)"
      path: $(HOME)/.nuget/packages

  - task: DotNetCoreCLI@2
    displayName: dotnet restore
    inputs:
      command: restore
      projects: ${{ parameters.solution }}

  - ${{ if eq(parameters.restoreOnly, false) }}:
      - task: DotNetCoreCLI@2
        displayName: dotnet build (${{ parameters.buildConfiguration }}, --no-restore)
        inputs:
          command: build
          projects: ${{ parameters.solution }}
          arguments: -c ${{ parameters.buildConfiguration }} --no-restore
