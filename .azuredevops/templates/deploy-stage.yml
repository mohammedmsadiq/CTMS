# -----------------------------------------------------------------------------
# Reusable DEPLOY STAGE for CTMS -> Azure Container Apps, one per environment
# (Development / Test / Staging / Production).
#
# It runs `az deployment group create` against deploy/azure/main.bicep, pointing
# `apiImage` at the tag the Package stage pushed to ACR, then smoke-tests
# GET /health/ready against the deployment's `apiFqdn` output.
#
# GATING
#   * `deployEnabled` (param, default 'false') keeps the stage inert until the
#     deploy/azure infra and the Azure DevOps Environments exist. Flip it per
#     environment in azure-pipelines.yml (or in the `ctms-deploy` variable
#     group) when ready. Nothing here needs to actually run for the pipeline to
#     be valid.
#   * The `deployment` job targets an Azure DevOps **Environment**
#     (`environmentName`). Approvals and branch/exclusive-lock checks are
#     configured on that Environment in the ADO UI — that is where the real
#     Production approval lives. See docs/azure-devops.md.
#   * `requireManualApproval: true` (Production) additionally adds an in-pipeline
#     `ManualValidation` gate on an agentless job, so an approval step exists
#     even before the Environment's checks are configured.
#
# SECRETS
#   None in YAML. `azureServiceConnection` is a service-connection *name*; the
#   Bicep resolves Mongo/Redis connection strings from Key Vault references at
#   runtime via the container app's managed identity (see docs/azure-deployment.md).
# -----------------------------------------------------------------------------
parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: dependsOn
    type: string
  - name: environmentName
    type: string          # Azure DevOps Environment name, e.g. ctms-production
  - name: deployEnabled
    type: string          # 'true' | 'false' (string so it can come from a variable)
    default: 'false'
  - name: requireManualApproval
    type: boolean
    default: false
  - name: azureServiceConnection
    type: string
    default: ''            # ARM / workload-identity service connection name (ctms-deploy group)
  - name: resourceGroup
    type: string
    default: ''
  - name: bicepEnvironmentName
    type: string           # main.bicep `environmentName` param: dev | test | prod
    default: dev
  - name: bicepFile
    type: string
    default: deploy/azure/main.bicep
  - name: parametersFile
    type: string
    default: deploy/azure/parameters.example.json   # TODO: real per-env file
  - name: acrLoginServer
    type: string
    default: ''            # e.g. myregistry.azurecr.io (ctms-acr group)
  - name: imageRepository
    type: string
    default: ''            # e.g. ctms/api (ctms-acr group)
  - name: imageTag
    type: string
    default: $(Build.BuildNumber)

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    # Inert unless the caller opts this environment in.
    condition: and(succeeded(), eq('${{ parameters.deployEnabled }}', 'true'))
    jobs:
      - ${{ if parameters.requireManualApproval }}:
          - job: approval
            displayName: Manual approval
            pool: server               # agentless — required by ManualValidation@0
            timeoutInMinutes: 4320      # 3 days to approve
            steps:
              - task: ManualValidation@0
                inputs:
                  notifyUsers: ''
                  instructions: >-
                    Approve the ${{ parameters.displayName }} of CTMS
                    $(Build.BuildNumber) (image
                    ${{ parameters.acrLoginServer }}/${{ parameters.imageRepository }}:${{ parameters.imageTag }}).
                  onTimeout: reject

      - deployment: deploy_container_app
        displayName: az deployment group create (deploy/azure/main.bicep)
        ${{ if parameters.requireManualApproval }}:
          dependsOn: approval
        environment: ${{ parameters.environmentName }}
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: Provision / update infra from Bicep
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      # Redeploying the Bicep with a new apiImage rolls the
                      # container app to a new revision.
                      az deployment group create \
                        --resource-group "${{ parameters.resourceGroup }}" \
                        --name "ctms-$(Build.BuildNumber)" \
                        --template-file "${{ parameters.bicepFile }}" \
                        --parameters "@${{ parameters.parametersFile }}" \
                        --parameters environmentName="${{ parameters.bicepEnvironmentName }}" \
                        --parameters apiImage="${{ parameters.acrLoginServer }}/${{ parameters.imageRepository }}:${{ parameters.imageTag }}"

                - task: AzureCLI@2
                  displayName: Smoke test GET /health/ready
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      FQDN=$(az deployment group show \
                        --resource-group "${{ parameters.resourceGroup }}" \
                        --name "ctms-$(Build.BuildNumber)" \
                        --query 'properties.outputs.apiFqdn.value' -o tsv)
                      echo "Probing https://${FQDN}/health/ready"
                      for i in $(seq 1 10); do
                        if curl -fsS "https://${FQDN}/health/ready"; then exit 0; fi
                        echo "not ready yet (attempt $i); sleeping 15s"; sleep 15
                      done
                      echo "##vso[task.logissue type=error]/health/ready never returned 200"
                      exit 1
